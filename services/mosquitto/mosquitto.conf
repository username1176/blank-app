# =============================================================================
# Mosquitto MQTT broker — local development configuration
#
# Allows anonymous connections on the standard port.  Not suitable for
# production; add password_file and TLS settings before exposing externally.
# =============================================================================

# Listen on the standard MQTT port on all interfaces
listener 1883 0.0.0.0

# Permit unauthenticated connections (dev only)
allow_anonymous true

# Persistence — survive broker restarts within the same Docker session
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Keep a reasonable in-flight message limit per client
max_inflight_messages 20

# Disconnect idle clients after 5 minutes of inactivity
keepalive_interval 300
