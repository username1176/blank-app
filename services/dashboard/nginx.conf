# =============================================================================
# Warehouse Platform — Nginx SPA config
#
# Responsibilities:
#   1. Serve the compiled React SPA with proper cache headers.
#   2. Proxy /api/* and /auth/* upstream to the API gateway so the browser
#      never has to deal with cross-origin issues in the Docker environment.
#   3. SPA fallback: unknown paths return index.html (client-side router
#      handles them).
#   4. Lightweight health endpoint for Docker's healthcheck.
# =============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "same-origin"     always;

    # ── Cache: Vite outputs content-hashed filenames — cache aggressively ──────
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires           1y;
        add_header        Cache-Control "public, immutable";
        access_log        off;
    }

    # index.html must never be cached so the browser picks up new deploys
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── API proxy → api-gateway ────────────────────────────────────────────────
    # Strips the /api prefix before forwarding so the gateway sees plain paths.
    location /api/ {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger request bodies (file uploads, bulk inventory posts)
        client_max_body_size 16m;

        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;

        # Do not buffer slow upstream responses (SSE-friendly)
        proxy_buffering off;
    }

    # ── Auth proxy → api-gateway ───────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    10s;
        proxy_connect_timeout 5s;
    }

    # ── Health check endpoint (used by Docker HEALTHCHECK) ────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA fallback — all other paths return index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
