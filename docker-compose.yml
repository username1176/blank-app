services:
  db:
    image: timescale/timescaledb-ha:pg16-latest
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       warehouse_dev
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tsdb_data:
