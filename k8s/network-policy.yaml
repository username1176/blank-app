        - protocol: TCP
          port: 3002
---
# ── environment-service: accept from api-gateway only ────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-environment-service
  namespace: warehouse
spec:
  podSelector:
    matchLabels:
      app: environment-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
