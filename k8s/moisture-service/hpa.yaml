apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moisture-service
  namespace: warehouse
  labels:
    app: moisture-service
    app.kubernetes.io/part-of: warehouse-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moisture-service
  # Start at 1 replica — model weights consume ~1 Gi RAM each pod.
  # Increase minReplicas to 2 once ReadOnlyMany PVC is provisioned.
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      # Be conservative when scaling down — model cold-starts are expensive.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
