apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: warehouse
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: warehouse-platform
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: warehouse
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: warehouse-platform
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
