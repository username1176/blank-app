# =============================================================================
# Warehouse Platform — Secret template
#
# DO NOT commit real values.  In production use one of:
#   - Sealed Secrets:       https://github.com/bitnami-labs/sealed-secrets
#   - External Secrets Operator: https://external-secrets.io
#   - AWS Secrets Manager / GCP Secret Manager CSI driver
#
# To generate base64-encoded values locally:
#   echo -n "my-value" | base64
#
# All values below are base64-encoded placeholders.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-secrets
  namespace: warehouse
  labels:
    app.kubernetes.io/part-of: warehouse-platform
type: Opaque
data:
  # ── PostgreSQL credentials ───────────────────────────────────────────────────
  # echo -n "warehouse_prod" | base64
  DB_USER:     d2FyZWhvdXNlX3Byb2Q=
  # Replace with a strong password: openssl rand -base64 32 | base64
  DB_PASSWORD: Q0hBTkdFX01F

  # ── JWT signing secrets ──────────────────────────────────────────────────────
  # Generate with: openssl rand -hex 32 | base64
  JWT_SECRET:         Q0hBTkdFX01FX0pXVF9TRUNSRVRfMzJDSEFSUw==
  JWT_REFRESH_SECRET: Q0hBTkdFX01FX1JFRlJFU0hfU0VDUkVUXzMyQw==

  # ── SendGrid (email notifications) ───────────────────────────────────────────
  # echo -n "SG.xxxx" | base64
  SENDGRID_API_KEY: U0dfWFhYWFhYWA==

  # ── Twilio (SMS notifications) ────────────────────────────────────────────────
  # echo -n "ACxxxx" | base64
  TWILIO_ACCOUNT_SID: QUNYWFHYWFHYWFHYWQ==
  # echo -n "your-twilio-auth-token" | base64
  TWILIO_AUTH_TOKEN:  Q0hBTkdFX01F

  # ── Redis password (if auth enabled on the Redis cluster) ────────────────────
  # Leave empty string if Redis runs without auth in a private cluster network.
  REDIS_PASSWORD: ""
