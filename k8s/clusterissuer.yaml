# =============================================================================
# cert-manager ClusterIssuer — Let's Encrypt production CA
#
# Apply this AFTER cert-manager is installed in the cluster.
# Replace the email address before applying.
#
# Staging issuer (for testing without rate-limit risk):
#   server: https://acme-staging-v02.api.letsencrypt.org/directory
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@warehouse-platform.io      # ← replace with your ops email
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
