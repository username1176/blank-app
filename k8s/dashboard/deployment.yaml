apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: warehouse
  labels:
    app: dashboard
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: warehouse-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dashboard
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: warehouse-platform
    spec:
      serviceAccountName: dashboard
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        # nginx:1.27-alpine runs worker processes as nginx (uid 101)
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dashboard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: dashboard
          # The Vite env vars (VITE_API_URL, VITE_MAPBOX_TOKEN) are baked into
          # the static bundle at image build time.  Build the image with:
          #   docker build --build-arg VITE_API_URL=/api \
          #                --build-arg VITE_MAPBOX_TOKEN=pk.xxx \
          #                -t ghcr.io/your-org/warehouse/dashboard:latest \
          #                services/dashboard/
          image: ghcr.io/your-org/warehouse/dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Nginx needs to write to these paths even with readOnlyRootFilesystem
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
