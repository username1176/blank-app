apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: warehouse
  labels:
    app: dashboard
    app.kubernetes.io/part-of: warehouse-platform
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: warehouse
  labels:
    app: dashboard
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: warehouse-platform
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
